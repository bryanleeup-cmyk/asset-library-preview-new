    <rect x="440" y="34" width="184" height="110" rx="8" fill="#eef4ff"/>
    <text x="704" y="94" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#4b5563">合集内多选：仅保留“从合集移除”，不再显示“添加至合集”。</text>
