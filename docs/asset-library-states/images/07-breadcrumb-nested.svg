<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f3f7ff"/>
  <rect x="84" y="56" width="1112" height="608" rx="28" fill="#fff"/>
  <text x="126" y="120" font-family="Arial, 'PingFang SC', sans-serif" font-size="32" font-weight="700" fill="#1f2937">进入合集：面包屑表达层级，最多两层子合集</text>

  <g transform="translate(126 166)" font-family="Arial, 'PingFang SC', sans-serif">
