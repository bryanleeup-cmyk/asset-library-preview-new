    <rect x="0" y="32" width="250" height="148" rx="10" fill="#f7faff" stroke="#8db0ff" stroke-dasharray="8 8"/>
    <text x="105" y="92" font-family="Arial" font-size="40" fill="#2f63ff">+</text>
    <text x="78" y="132" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#2f63ff">新建合集</text>
    <rect x="294" y="32" width="250" height="148" rx="10" fill="#eef4ff"/>
    <text x="390" y="110" font-family="Arial" font-size="38" fill="#2f63ff">≡</text>
    <text x="294" y="216" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#1f2937">投放前贴 0</text>
    <text x="514" y="216" font-family="Arial" font-size="26" fill="#7a879b">...</text>
  </g>

  <g transform="translate(126 526)">
    <text x="0" y="0" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="700" fill="#111827">当前合集视频</text>
