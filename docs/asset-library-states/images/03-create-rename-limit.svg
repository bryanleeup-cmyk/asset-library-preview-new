<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#edf3fb"/>
  <rect x="250" y="86" width="780" height="548" rx="18" fill="#fff"/>
  <text x="310" y="156" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#111827">新建 / 重命名合集</text>
  <text x="960" y="150" font-family="Arial" font-size="44" fill="#6b7280">×</text>

  <text x="310" y="236" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="700" fill="#1f2937">合集名称</text>
  <rect x="310" y="264" width="660" height="54" rx="9" fill="#f7faff" stroke="#2f63ff" stroke-width="2"/>
  <text x="334" y="299" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" fill="#111827">债务短视频素材</text>
  <text x="890" y="299" font-family="Arial" font-size="21" fill="#6b7280">7 / 20</text>
  <text x="310" y="352" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#6b7280">最多 20 个字，达到上限后不再继续输入；计数器放在输入框内。</text>

  <g transform="translate(310 394)">
    <rect width="660" height="54" rx="9" fill="#fff7f7" stroke="#ff4d4f" stroke-width="2"/>
    <text x="24" y="35" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" fill="#111827">债务短视频素材</text>
    <text x="578" y="35" font-family="Arial" font-size="21" fill="#ff4d4f">7 / 20</text>
    <text x="0" y="86" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" fill="#ff4d4f">同一层级下已有同名合集，请修改名称。</text>
  </g>

  <rect x="624" y="532" width="144" height="56" rx="10" fill="#f0f3fa"/>
  <text x="672" y="568" font-family="Arial, 'PingFang SC', sans-serif" font-size="23" fill="#1f2937">取消</text>
  <rect x="790" y="532" width="180" height="56" rx="10" fill="#2f63ff"/>
  <text x="838" y="568" font-family="Arial, 'PingFang SC', sans-serif" font-size="23" font-weight="700" fill="#fff">确定</text>

  <rect x="392" y="32" width="496" height="64" rx="20" fill="#fff" filter="drop-shadow(0 12px 30px rgba(64,91,140,.2))"/>
  <circle cx="434" cy="64" r="18" fill="#35b34a"/>
  <path d="M425 64l7 7 14-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="468" y="72" font-family="Arial, 'PingFang SC', sans-serif" font-size="23" font-weight="700" fill="#111827">合集创建成功</text>
  <text x="840" y="75" font-family="Arial" font-size="36" fill="#111827">×</text>
</svg>
