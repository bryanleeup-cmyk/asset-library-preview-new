<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#d9e0ea"/>
  <rect x="150" y="54" width="980" height="612" rx="18" fill="#fff"/>
  <text x="208" y="124" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#111827">添加至合集</text>
  <text x="1050" y="120" font-family="Arial" font-size="42" fill="#6b7280">×</text>

  <rect x="208" y="176" width="864" height="390" rx="12" fill="#fafcff" stroke="#dce5f2" stroke-width="2"/>
  <rect x="230" y="198" width="820" height="62" rx="10" fill="#eef4ff" stroke="#d89600" stroke-width="2"/>
  <text x="264" y="238" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#1f2937">全部视频</text>
  <text x="870" y="238" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#8a94a6">根视图，不能作为添加目标</text>

  <g transform="translate(266 300)">
    <text x="0" y="30" font-family="Arial" font-size="32" fill="#2f63ff">≡</text>
    <text x="64" y="31" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="700" fill="#1f2937">债务短视频素材</text>
    <text x="700" y="31" font-family="Arial, 'PingFang SC', sans-serif" font-size="21" fill="#7a879b">3项内容</text>
  </g>
  <g transform="translate(310 388)">
    <text x="0" y="30" font-family="Arial" font-size="32" fill="#2f63ff">≡</text>
    <text x="64" y="31" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="700" fill="#1f2937">高转化前贴</text>
    <text x="656" y="31" font-family="Arial, 'PingFang SC', sans-serif" font-size="21" fill="#7a879b">0项内容</text>
  </g>

  <text x="208" y="616" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#2f63ff">≡ 新建合集</text>
  <rect x="764" y="584" width="136" height="56" rx="10" fill="#f0f3fa"/>
  <text x="810" y="620" font-family="Arial, 'PingFang SC', sans-serif" font-size="23" fill="#1f2937">取消</text>
  <rect x="920" y="584" width="152" height="56" rx="10" fill="#dfe5f0"/>
  <text x="948" y="620" font-family="Arial, 'PingFang SC', sans-serif" font-size="23" font-weight="700" fill="#98a2b3">添加到此处</text>

  <rect x="790" y="32" width="300" height="56" rx="16" fill="#fff" filter="drop-shadow(0 12px 30px rgba(64,91,140,.2))"/>
  <text x="822" y="67" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#4b5563">选择具体合集后，按钮变为可用</text>
</svg>
